name: Android emulator tests

# Emulator runs are expensive, so they run on demand and on pushes to main that touch
# app or core code, never on documentation-only changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/src/main/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/emulator.yml"
      - "scripts/emulator-tests.sh"

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Instrumented and Compose UI tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash scripts/emulator-tests.sh

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-results
          path: emulator-output/
          if-no-files-found: warn
          retention-days: 30
