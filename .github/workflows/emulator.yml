name: Android emulator tests

# Emulator runs are expensive, so they run on demand at milestones rather than on
# every push. Cheap compile and JVM checks run in build.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Instrumented and Compose UI tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A disposable Actual server (the oracle's version) for one device test; synthetic password,
    # no volume, gone when the job ends.
    services:
      actual:
        image: actualbudget/actual-server:26.10.0
        ports:
          - 5006:5006
    env:
      ACTUAL_TEST_SERVER_URL: http://localhost:5006
      ACTUAL_TEST_SERVER_PASSWORD: ci-synthetic-password-1
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Free disk space for the emulator
        # The AVD needs several GB for userdata. Remove large toolchains this job never
        # uses (the Android SDK is kept).
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/lib/node_modules /opt/microsoft /opt/google/chrome || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Bootstrap the disposable Actual server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5006/account/needs-bootstrap > /dev/null; then break; fi
            sleep 2
          done
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"password\":\"$ACTUAL_TEST_SERVER_PASSWORD\"}" \
            http://localhost:5006/account/bootstrap > /dev/null
          echo "bootstrapped"

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 4096M
          ram-size: 3072M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash scripts/emulator-tests.sh

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-results
          path: emulator-output/
          if-no-files-found: warn
          retention-days: 30
