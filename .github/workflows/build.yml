name: Build and unit test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK and JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK and run JVM unit tests
        run: ./gradlew --no-daemon --stacktrace :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Summarize unit tests
        if: always()
        run: python3 scripts/junit-summary.py core/build/test-results app/build/test-results >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: actualist-android-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
